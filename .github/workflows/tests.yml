name: Unity Unit Tests

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run EditMode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # The Wwise integration only ships the Windows/Mac platform API, so the Linux editor used here
      # can't compile it. EditMode tests never touch audio: compile the Windows API on Linux as well.
      # CI only; the files in the repo stay as Wwise generated them.
      - name: Let Wwise compile on the Linux editor
        run: |
          files=$(grep -rlE '\bUNITY_EDITOR_WIN\b' Assets/Wwise --include=*.cs)
          test -n "$files" || { echo "No UNITY_EDITOR_WIN guards found in Assets/Wwise"; exit 1; }
          sed -i -E 's/\bUNITY_EDITOR_WIN\b/(UNITY_EDITOR_WIN || UNITY_EDITOR_LINUX)/g' $files
          echo "Patched $(echo "$files" | wc -l) Wwise files"

      - name: Restore Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.4f1
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results-EditMode
          path: artifacts
