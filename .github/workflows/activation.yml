name: Acquire Unity Activation File (.alf)

on:
  workflow_dispatch:

jobs:
  acquire_alf:
    name: Acquire .alf file
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.3.4f1-webgl-3
    steps:
      - name: Generate .alf file
        run: |
          unity-editor -batchmode -nographics -quit -createManualActivationFile || true
          ls -la *.alf

      - name: Upload .alf as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: "*.alf"
