name: Build and Deploy Windows

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-windows-

      - name: Clean Bee build cache
        run: rm -rf Library/Bee

      - name: Build
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Bunker

      - name: Prepare permissions
        run: sudo chown -R $USER:$USER build/

      - name: Deploy to Itch.io with Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d bin/
          chmod +x bin/butler
          ./bin/butler push build/StandaloneWindows64/StandaloneWindows64 virterex/bunker:windows --userversion ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/StandaloneWindows64/StandaloneWindows64
